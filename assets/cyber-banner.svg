<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="45%" stop-color="#0d1120" />
      <stop offset="85%" stop-color="#190d26" />
      <stop offset="100%" stop-color="#0c0716" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyberPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ff79c6" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff2a85" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="phoneGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Card Clip -->
    <clipPath id="cardClip">
      <rect width="1000" height="320" rx="20" />
    </clipPath>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes rotateCw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCcw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(-10px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(330px); opacity: 0; }
      }
      @keyframes beamMove {
        0% { transform: translateX(-180px); }
        100% { transform: translateX(700px); }
      }
      @keyframes pulsePhone {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 42, 133, 0.6)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.8)); }
      }
      @keyframes blinkLive {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes floatCore {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .rot-cw {
        animation: rotateCw 22s linear infinite;
        transform-origin: 130px 160px;
      }
      .rot-ccw {
        animation: rotateCcw 16s linear infinite;
        transform-origin: 130px 160px;
      }
      .rot-fast {
        animation: rotateCw 9s linear infinite;
        transform-origin: 130px 160px;
      }
      .hud-float {
        animation: floatCore 4s ease-in-out infinite;
      }
      .core-phone {
        animation: pulsePhone 3s ease-in-out infinite;
        transform-origin: 130px 160px;
      }
      .beam-pulse {
        animation: beamMove 3.6s ease-in-out infinite;
      }
      .live-blink {
        animation: blinkLive 1.8s ease-in-out infinite;
      }
      .mono-text {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .sans-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        font-weight: 900;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Enclosed Card -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1000" height="320" fill="url(#bgGrad)" />

    <!-- Grid Overlay -->
    <rect width="1000" height="320" fill="url(#cyberGrid)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="130" cy="160" r="130" fill="#ff2a85" fill-opacity="0.12" filter="url(#glowPink)" />
    <circle cx="850" cy="80" r="140" fill="#a855f7" fill-opacity="0.10" filter="url(#glowPink)" />
    <circle cx="500" cy="270" r="110" fill="#00f0ff" fill-opacity="0.06" filter="url(#glowPink)" />

    <!-- Laser Scanning Beam -->
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.25" style="animation: scanline 5s linear infinite;" />

    <!-- ==================== LEFT: HOLOGRAPHIC MOBILE ARCHITECTURE CORE ==================== -->
    <g class="hud-float">
      <!-- Outer Orbit Ring with Ticks -->
      <circle cx="130" cy="160" r="92" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8" />

      <!-- Rotating Dashed Ring (Cyber Pink) -->
      <circle class="rot-cw" cx="130" cy="160" r="80" fill="none" stroke="#ff2a85" stroke-width="2" stroke-dasharray="16 24 40 16" stroke-opacity="0.8" filter="url(#glowSoft)" />

      <!-- Counter-rotating Ring (Neon Violet) -->
      <circle class="rot-ccw" cx="130" cy="160" r="66" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="24 16 10 20" stroke-opacity="0.7" />

      <!-- Inner Fast Radar Ring (Electric Cyan) -->
      <circle class="rot-fast" cx="130" cy="160" r="52" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="10 26" stroke-opacity="0.85" />

      <!-- Radar Crosshair Ticks -->
      <line x1="130" y1="60" x2="130" y2="74" stroke="#ff2a85" stroke-width="2" stroke-opacity="0.85" />
      <line x1="130" y1="246" x2="130" y2="260" stroke="#ff2a85" stroke-width="2" stroke-opacity="0.85" />
      <line x1="30" y1="160" x2="44" y2="160" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.85" />
      <line x1="216" y1="160" x2="230" y2="160" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.85" />

      <!-- Center Holographic Smartphone Device Silhouette -->
      <g class="core-phone">
        <!-- Phone Outer Frame -->
        <rect x="108" y="122" width="44" height="76" rx="8" fill="#080f1d" stroke="url(#phoneGlowGrad)" stroke-width="2.5" />
        <!-- Speaker Notch -->
        <line x1="123" y1="127" x2="137" y2="127" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
        <!-- Screen Content Hologram -->
        <rect x="112" y="132" width="36" height="58" rx="4" fill="#0d1b2a" fill-opacity="0.8" />
        <!-- Header Bar -->
        <rect x="115" y="136" width="30" height="6" rx="2" fill="#ff2a85" fill-opacity="0.8" />
        <!-- Feed Card 1 -->
        <rect x="115" y="146" width="30" height="12" rx="2" fill="#a855f7" fill-opacity="0.5" />
        <line x1="118" y1="152" x2="138" y2="152" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
        <!-- Feed Card 2 -->
        <rect x="115" y="162" width="30" height="12" rx="2" fill="#00f0ff" fill-opacity="0.4" />
        <line x1="118" y1="168" x2="134" y2="168" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
        <!-- Bottom Nav Bar -->
        <rect x="115" y="178" width="30" height="8" rx="2" fill="#1e293b" />
        <circle cx="120" cy="182" r="1.5" fill="#ff2a85" />
        <circle cx="130" cy="182" r="1.5" fill="#00f0ff" />
        <circle cx="140" cy="182" r="1.5" fill="#a855f7" />
      </g>

      <!-- Subtext under Core -->
      <text class="mono-text" x="130" y="278" fill="#94a3b8" font-size="11" text-anchor="middle" letter-spacing="3">MOBILE CORE // 2.0</text>
    </g>

    <!-- Vertical Neon Divider -->
    <line x1="250" y1="40" x2="250" y2="280" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="250" cy="75" r="3" fill="#ff2a85" filter="url(#glowSoft)" />
    <circle cx="250" cy="160" r="2.5" fill="#00f0ff" />
    <circle cx="250" cy="245" r="3" fill="#a855f7" filter="url(#glowSoft)" />

    <!-- ==================== RIGHT: IDENTITY & TELEMETRY ==================== -->

    <!-- Top System Telemetry Bar -->
    <g transform="translate(275, 48)">
      <circle class="live-blink" cx="8" cy="7" r="5" fill="#10b981" filter="url(#glowSoft)" />
      <text class="mono-text" x="22" y="11" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1.5">SYS: ONLINE</text>
      
      <text class="mono-text" x="135" y="11" fill="#475569" font-size="12">|</text>
      
      <text class="mono-text" x="155" y="11" fill="#c084fc" font-size="12" letter-spacing="1">MOBILE APPLICATION ARCHITECT</text>
      
      <rect x="580" y="-3" width="105" height="20" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#ff2a85" stroke-width="0.8" />
      <text class="mono-text" x="632" y="11" fill="#ff79c6" font-size="10" font-weight="600" text-anchor="middle">UNKLAB // FIK</text>
    </g>

    <!-- Main Hero Name -->
    <g transform="translate(275, 115)">
      <text class="sans-title" x="0" y="0" fill="url(#cyberTextGrad)" font-size="44" filter="url(#glowSoft)">TIARA MAMUAYA</text>
    </g>

    <!-- Dynamic Role / Tagline -->
    <g transform="translate(275, 148)">
      <text class="mono-text" x="0" y="0" fill="#00f0ff" font-size="16" font-weight="600" letter-spacing="1">&gt; Crafting Fluid, High-Performance Mobile Applications</text>
    </g>

    <!-- Glowing Animated Pulse Line -->
    <g transform="translate(275, 168)">
      <line x1="0" y1="0" x2="685" y2="0" stroke="#1e293b" stroke-width="2" />
      <rect class="beam-pulse" x="0" y="-1.5" width="160" height="3" fill="url(#pulseBeam)" />
    </g>

    <!-- Holographic Badges Row -->
    <g transform="translate(275, 195)">
      <!-- Badge 1: Academic -->
      <g transform="translate(0, 0)">
        <rect width="210" height="36" rx="8" fill="#170d24" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="18" cy="18" r="7" fill="#c084fc" fill-opacity="0.2" />
        <text x="18" y="22" font-size="12" text-anchor="middle">🎓</text>
        <text class="mono-text" x="34" y="22" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="0.5">UNKLAB (2023-2027)</text>
      </g>

      <!-- Badge 2: Specialty -->
      <g transform="translate(225, 0)">
        <rect width="255" height="36" rx="8" fill="#240c1a" fill-opacity="0.85" stroke="#ff2a85" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="18" cy="18" r="7" fill="#ff79c6" fill-opacity="0.2" />
        <text x="18" y="22" font-size="12" text-anchor="middle">📱</text>
        <text class="mono-text" x="34" y="22" fill="#ff79c6" font-size="11" font-weight="700" letter-spacing="0.5">REACT NATIVE &amp; EXPO</text>
      </g>

      <!-- Badge 3: Collab / Intern -->
      <g transform="translate(495, 0)">
        <rect width="190" height="36" rx="8" fill="#081824" fill-opacity="0.85" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="18" cy="18" r="7" fill="#38bdf8" fill-opacity="0.2" />
        <text x="18" y="22" font-size="12" text-anchor="middle">✨</text>
        <text class="mono-text" x="34" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">OPEN TO COLLAB</text>
      </g>
    </g>

    <!-- Bottom Console Status Line -->
    <g transform="translate(275, 272)">
      <rect width="686" height="30" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text class="mono-text" x="14" y="19" fill="#22c55e" font-size="12" font-weight="700">$</text>
      <text class="mono-text" x="30" y="19" fill="#94a3b8" font-size="11">tiara.init() </text>
      <text class="mono-text" x="115" y="19" fill="#38bdf8" font-size="11" font-weight="600">[React Native, Expo, TypeScript, Supabase, Python]</text>
      <circle class="live-blink" cx="666" cy="15" r="4" fill="#ff2a85" />
    </g>
  </g>

  <!-- Card Border Stroke -->
  <rect width="1000" height="320" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
